workflows:
  ios-release:
    name: Sengunthar iOS Build
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "Codemagic CI CD" 
    environment:
      groups:
        - credentials
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.senguntharinbusiness.app 
      node: latest
      xcode: latest
    scripts:
      - name: Install dependencies
        script: npm install
        
      - name: Generate .env file
        script: |
          echo "VITE_APIKEY=${VITE_APIKEY}" >> .env
          echo "VITE_AUTHDOMAIN=${VITE_AUTHDOMAIN}" >> .env
          echo "VITE_PROJECTID=${VITE_PROJECTID}" >> .env
          echo "VITE_STORAGEBUCKET=${VITE_STORAGEBUCKET}" >> .env
          echo "VITE_MESSAGINGSENDERID=${VITE_MESSAGINGSENDERID}" >> .env
          echo "VITE_APPID=${VITE_APPID}" >> .env
          echo "VITE_MEASUREMENTID=${VITE_MEASUREMENTID}" >> .env
          echo "VITE_BACKEND_SERVER=${VITE_BACKEND_SERVER}" >> .env
          
      - name: Build Web App
        script: npm run build
        
      - name: Sync Capacitor iOS
        script: npx cap sync ios
        
      # --- THE MISSING LINK: Force the workspace generation ---
      - name: Install CocoaPods (Generates Workspace)
        script: |
          cd ios/App
          pod install --repo-update
      # --------------------------------------------------------
          
      - name: Override Native Bundle ID
        script: |
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.senguntharinbusiness.app;/g' ios/App/App.xcodeproj/project.pbxproj
          
      - name: Apply Apple Certificates
        script: |
          xcode-project use-profiles
          
      - name: Build iOS native app
        script: |
          cat <<EOF > export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
          </dict>
          </plist>
          EOF
          
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App" \
            --export-options-plist export_options.plist
            
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true